[dependency-groups]
dev = [
  "pytest-cov>=7.1.0",
  "rank-bm25>=0.2.2"
]

[project]
authors = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "M.P. van der Schelling"}
]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS"
]
dependencies = [
  "cloudpickle>=3.1.2",
  "filelock>=3.16.1",
  "hydra-core>=1.3.2",
  "langchain-core>=0.3.86",
  "langgraph>=0.6.11",
  "langgraph-checkpoint-sqlite>=3.0.3",
  "numpy>=1.24.4",
  "pandas>=2.0.3",
  "pathos>=0.3.4",
  "salib>=1.5.2",
  "xarray>=2023.1.0",
]
description = "f3dasm - Framework for Data-driven Development and Analysis of Structures and Materials"
license = {text = "BSD-3-Clause"}
maintainers = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "M.P. van der Schelling"}
]
name = "f3dasm"
readme = "README.md"
requires-python = ">=3.10"
version = "2.2.3"

[project.optional-dependencies]
# Lean, torch-free orchestration core. The literature reviewer still works
# here, degraded to lexical retrieval: pymupdf does PDF→MD and rank-bm25 does
# search (no torch). docling/fastembed (the torch-pullers) live in
# `agentic-extra` as a quality upgrade.
agentic = [
  "claude-agent-sdk>=0.2.82,<1.0.0",
  "pymupdf>=1.24.0",
  "rank-bm25>=0.2.2",
  # The run deliverable is pipeline.ipynb; the reproduction gate executes it
  # lazily via nbclient. These are REQUIRED for the agentic runtime (the system
  # is committed to the notebook deliverable), so they live in the lean core.
  "nbclient>=0.7",
  "nbformat>=5.9",
  "ipykernel>=6.0",
  # paper search — lightweight (httpx + tenacity), so it stays in the lean core
  "semanticscholar>=0.8.0",
  "arxiv>=2.1.0",
  "langchain-community>=0.3.0,<1.0.0",
  "langchain-core>=0.3.0,<1.0.0",
  "langchain-ollama>=0.2.0,<1.0.0",
  "langchain-openai>=0.3.0,<1.0.0",
  "langgraph>=0.2.0,<1.0.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "ollama>=0.4.0",
  "requests>=2.28.0",
  # Cross-platform per-process memory telemetry + process-tree reap for the
  # worker resource governor (macOS has no cgroups/proc; psutil is the portable
  # RSS read + children(recursive) kill). Lightweight, no torch.
  "psutil>=5.9.0"
]
# Optional quality upgrade for the literature reviewer, installed ON TOP of
# `agentic`: layout-aware PDF→MD via docling (which pulls torch via
# docling-ibm-models — the ONLY torch-puller). The marker excludes the
# torch-bound wheels on Intel macOS, where the lean pymupdf path is used.
# Dense chunk embeddings (bge-small) are NOT here: they run in an isolated,
# torch-free uv subprocess (literature_corpus._SubprocessEmbedder, pinned to
# Python 3.12 for the onnxruntime wheel), so semantic search works on the lean
# `agentic` install without this tier. fastembed can't live in `agentic`
# either — onnxruntime ships no cp313 wheel, which would break a 3.13 install —
# so the subprocess is its only home.
agentic-extra = [
  "docling>=2.0.0; sys_platform != 'darwin' or platform_machine == 'arm64'"
]
all = [
  "abaqus2py>=1.0.0",
  "matplotlib>=3.7.5",
  "optuna>=4.4.0",
  "scipy>=1.10.1"
]
dev = [
  "pre-commit>=4.4.0",
  "ruff>=0.14.10"
]
docs = [
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-include-exclude-files>=0.1.0",
  "mkdocs-ipynb>=0.1.1",
  "mkdocs-material>=9.6.20",
  "mkdocstrings>=0.30.1",
  "mkdocstrings-python>=1.18.2",
  "pymdown-extensions>=10.16.1"
]
figures = [
  "matplotlib>=3.7.5"
]
# Back-compat alias: `lit` now folds into `agentic-extra` (which adds docling
# on top of the former fastembed + semanticscholar). `pip install f3dasm[lit]`
# keeps working.
lit = [
  "f3dasm[agentic-extra]"
]
scipy = [
  "scipy>=1.10.1"
]
tests = [
  "hypothesis>=6.138.0",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1"
]

[project.urls]
Documentation = "https://f3dasm.readthedocs.io/"
Repository = "https://github.com/bessagroup/f3dasm"

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about missing debug-only code:
  "def __repr__",
  "if self.debug",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
  # TYPE_CHECKING is used for type hinting, don't complain about it:
  "if TYPE_CHECKING:",
  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:",
  # Don't complain about abstract methods, they aren't run:
  "@(abc\\.)?abstractmethod"
]

[tool.coverage.run]
branch = true
omit = [
  "tests/",
  "**/__init__.py"
]
source = ["src"]

[tool.pytest.ini_options]
addopts = "--cov-report term --cov-report html --cov-config=.coveragerc --cov=f3dasm --cov-fail-under=85.00"
markers = [
  "smoke",
  "requires_dependency(name): mark the test as it requires a certain dependency",
  "ollama: marks tests that require a running Ollama server (skip with -m 'not ollama')",
  "integration: wet tests that hit real LLMs and external APIs (skip with -m 'not integration')"
]
minversion = "6.0"
pythonpath = [".", "src"]
testpaths = [
  "tests"
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
exclude = [
  "__pycache__",
  "dist",
  "*.egg",
  "docs/source",
  "tests",
  ".git",
  "experiments/*",
  "notebooks",
  "tests/*",
  "studies/*",
  "docs/*",
  "docs_old/*"
]
ignore = [
  "E226",
  "E3",
  "E501",
  "E731",
  "C901",
  "UP045",
  "B027",
  "B012"
]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "UP" # pyupgrade
]

[tool.uv]
package = true

[tools.setuptools]
packages = ["src"]
